name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No bloqueante por ahora: hay deuda de lint preexistente en el repo
      # (ver `npm run lint` localmente). El gate real es el build de abajo.
      - name: Lint — informativo
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.finopslatam.com
          NEXT_PUBLIC_SITE_URL: https://finopslatam.com
